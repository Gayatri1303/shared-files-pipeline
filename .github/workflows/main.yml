name: demo app

permissions:
  id-token: write
  contents: read

on: [workflow_dispatch]

jobs:
  deploy_on_aws:
    runs-on: self-hosted

    steps:

      - name: get token
        id: token
        run: |
          TOKEN=$(curl -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          echo "token=${TOKEN}" >> $GITHUB_OUTPUT

      - name: assume role
        id: awscreds
        run: |
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::174331605686:role/allow-ssmaccess_to_github_runners" \
            --role-session-name "github-session" \
            --web-identity-token "${{ steps.token.outputs.token }}" \
            --duration-seconds 3600)

      - name: deploy on ec2
        run: |
          aws ssm send-command \
            --instance-ids "i-07eb7aed4fc26e89a" \
            --document-name "custom_doc"
